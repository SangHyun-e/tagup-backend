spring:
  profiles:
    active: local
  application:
    name: tagup-backend

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:tagupdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# Firebase (로컬 개발: 미설정 시 Firebase 인증 비활성화됨)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  credentials-base64: ${FIREBASE_CREDENTIALS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-base64: ${FIREBASE_CREDENTIALS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# ---------------------------------------------------------------------------
# local-tunnel: Cloudflare Tunnel로 로컬 서버를 외부에 공개할 때 쓰는 프로파일.
#
# local 프로파일과의 차이 (전부 "인터넷에 노출된다"는 전제에서 나온 것):
#   1. H2를 파일 모드로 → 서버를 껐다 켜도 계정/방/배팅이 유지된다
#      (local은 인메모리 + create-drop이라 재시작 시 전부 소멸)
#   2. H2 콘솔 OFF → 켜져 있으면 sa/무암호로 DB를 통째로 열어주는 셈이다
#   3. Swagger OFF → 공개 주소에서 API 목록을 노출할 이유가 없다
#   4. Firebase 자격증명 필수 → 미설정 시 FirebaseTokenFilter가 토큰을 uid로
#      그대로 신뢰하므로(로컬 개발 모드), 남의 uid만 알면 사칭이 가능하다.
#      tagup.security.require-firebase=true 로 기동 자체를 막는다.
#
# 실행: scripts/tunnel.sh
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local-tunnel
  datasource:
    url: jdbc:h2:file:./data/tagupdb;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  credentials-base64: ${FIREBASE_CREDENTIALS:}

tagup:
  security:
    require-firebase: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
