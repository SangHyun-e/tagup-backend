services:
  app:
    image: ghcr.io/sanghyun-e/tagup-backend:latest
    container_name: tagup-backend
    env_file: .env
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tagup-network

  nginx:
    image: nginx:alpine
    container_name: tagup-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tagup-network

networks:
  tagup-network:
    driver: bridge
